server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This is the magic line for SPAs:
        # It tells Nginx to try serving the requested file, 
        # then the directory, and if neither exists, serve index.html.
        try_files $uri $uri/ /index.html;
    }

    # Standard error page configuration
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
